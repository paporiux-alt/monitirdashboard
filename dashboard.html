--green:#4ADE80;--greenbg:#14301F;--amber:#E7B54A;--amberbg:#33280F;--red:#F87171;--redbg:#3A1715;--orange:#FB923C;--orangebg:#3A2112;
--c1:#D9D4CA;--c2:#A89BD8;--c3:#D9A27A;--c4:#8DB397;--c5:#8FB2CF;
--ink:#2A2824;--ink-text:#F0EDE6;--ink-muted:#ABA59A;
--shadow:0 0 0 1px #2A2823;--pop:0 12px 32px rgba(0,0,0,.5),0 0 0 1px #33302A;--focus:0 0 0 3px rgba(86,184,169,.45)}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--sans);margin:0;line-height:1.2;letter-spacing:-.02em}
h1{font-size:28px;font-weight:600;letter-spacing:-.035em}h2{font-size:15px;font-weight:600}h3{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
p{margin:0}a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:0;box-shadow:var(--focus)!important;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--sans);font-weight:500;letter-spacing:-.005em}
.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:12.5px}
.ic{width:16px;height:16px;flex:none;fill:currentColor;display:inline-block;vertical-align:-3px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}.ic.lg{width:20px;height:20px}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--teal);color:var(--on-teal);padding:8px 12px;border-radius:8px}.skip:focus{top:10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--text);font-size:13px;font-weight:550;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-h);border-color:var(--teal-h)}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal)}
.btn.sm{min-height:30px;padding:4px 12px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--panel);color:var(--text)}
.iconbtn.round{border-radius:99px;background:var(--panel)}
.linkbtn{border:0;background:none;padding:0;color:var(--teal);font-weight:550;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.linkbtn:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--panel3);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:550;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(60,48,30,.12)}

/* Shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px 14px;gap:12px;z-index:20;overflow-y:auto}
.side-top{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:650;letter-spacing:-.04em;color:var(--text);text-decoration:none;padding:2px 6px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}.mark svg{width:17px;height:17px}
.ws{display:flex;align-items:center;gap:10px;border:0;background:var(--panel);padding:8px 10px;border-radius:12px;width:100%;text-align:left;box-shadow:var(--shadow)}
.ws-logo{width:28px;height:28px;border-radius:8px;background:var(--text);color:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ws-txt{flex:1;line-height:1.25}.ws-txt b{display:block;font-size:13px;font-weight:600}.ws-txt small{font-size:12px;color:var(--muted)}
.ws .ic{color:var(--subtle)}
.setupmini{padding:12px 12px 10px;border-radius:12px;background:var(--ink);color:var(--ink-text);font-size:12.5px}
.setupmini .muted{color:var(--ink-muted)}
.setupmini .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.14);margin:8px 0 4px;overflow:hidden}
.setupmini .bar span{display:block;height:100%;background:var(--aqua2);border-radius:9px;transition:width .3s}
.setupmini .linkbtn{color:var(--link-on-dark);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;text-align:left;width:100%;text-decoration:none}
.navitem:hover{background:rgba(255,255,255,.55);color:var(--text)}
[data-theme=dark] .navitem:hover{background:var(--panel)}
.navitem[aria-current=page]{background:var(--panel);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.navitem[aria-current=page] .ic{color:var(--acc)}
.navitem .count{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--panel3);color:var(--text);border-radius:99px;padding:1px 8px}
.navgroup{font-size:12px;color:var(--subtle);font-weight:500;padding:14px 12px 4px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.account{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:0;background:var(--panel);width:100%;text-align:left;box-shadow:var(--shadow)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--pk);color:var(--text);display:grid;place-items:center;font-size:11.5px;font-weight:650;flex:none}
.avatar.sm{width:22px;height:22px;font-size:9.5px}
.avatar.legal{background:var(--pl);color:var(--text)}.avatar.it{background:var(--ps);color:var(--text)}.avatar.brand{background:var(--pp);color:var(--text)}
.account .who{flex:1;line-height:1.3}.account b{display:block;font-size:13px;font-weight:600}.account small{font-size:12px;color:var(--muted)}
.account .ic{color:var(--subtle)}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:12px;padding:0 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;height:40px;border:0;background:var(--panel);border-radius:99px;padding:0 64px 0 40px;font-size:13px;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--subtle)}
.search .ic{position:absolute;left:15px;top:12px;color:var(--subtle)}
.search kbd{position:absolute;right:12px;top:10px;font:500 11.5px var(--sans);color:var(--muted);background:var(--panel2);border-radius:6px;padding:1px 7px}
.topright{display:flex;align-items:center;gap:8px;margin-left:auto}
.agentpill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:99px;border:0;background:var(--panel);font-size:12.5px;font-weight:550;box-shadow:var(--shadow)}
.agentpill .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-out infinite}
.agentpill.paused{background:var(--amberbg);color:var(--amber)}.agentpill.paused .pulse{background:var(--amber);animation:none}
.agentpill.hot{background:var(--redbg);color:var(--red)}.agentpill.hot .pulse{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,118,110,.45)}70%{box-shadow:0 0 0 7px rgba(15,118,110,0)}100%{box-shadow:0 0 0 0 rgba(15,118,110,0)}}
.badge-dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.theme-switch{display:inline-flex;gap:2px;padding:3px;background:var(--panel);border-radius:99px;box-shadow:var(--shadow)}
.theme-option{display:inline-grid;place-items:center;width:30px;height:30px;border:0;border-radius:99px;background:transparent;color:var(--muted)}
.theme-option[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}
.menu-toggle{display:none}
main{padding:4px 32px 110px}
.page{max-width:1360px;margin:0 auto}

/* Page head */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:10px 0 22px;flex-wrap:wrap}
.pagehead .date{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.pagehead p.sub{color:var(--muted);margin-top:6px;font-size:13.5px}
.pagehead .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.livechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;color:var(--text);background:var(--panel);padding:2px 9px;border-radius:99px}
.livechip i{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* Cards */
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.section{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.chead h2{display:flex;align-items:center;gap:8px}
.chead p{font-size:12.5px;color:var(--muted);margin-top:3px}
.chead .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.shead .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hicon{width:28px;height:28px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);flex:none}
.cbody{padding:0 20px 20px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-main{grid-template-columns:minmax(0,1fr) 360px}
.g-2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-2e{grid-template-columns:1fr 1fr}
.grid>.section,.grid>.card{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:550;padding:2px 9px;border-radius:99px;background:var(--panel3);color:var(--text);white-space:nowrap;line-height:1.55}
.tag.ai{background:var(--aquabg);color:var(--aqua)}.tag.sample{background:var(--amberbg);color:var(--amber)}.tag.new{background:var(--accbg);color:var(--acc)}
.tag.ok{background:var(--greenbg);color:var(--green)}.tag.warn{background:var(--amberbg);color:var(--amber)}.tag.bad{background:var(--redbg);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--text);white-space:nowrap}
.chip .ic{color:var(--muted)}.chip.crit{background:var(--amberbg);color:var(--amber)}.chip em{font-style:normal;font-weight:600;font-size:11px}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sev.critical{color:var(--red)}.sev.high{color:var(--orange)}.sev.medium{color:var(--amber)}.sev.low{color:var(--muted)}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.conf i{display:inline-flex;gap:2px;margin-right:2px}.conf i b{width:4px;height:11px;border-radius:2px;background:var(--line)}.conf i b.on{background:var(--acc)}
.conf .clbl{display:none}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px}
.delta.up{background:var(--redbg);color:var(--red)}.delta.ok{background:var(--greenbg);color:var(--green)}.delta.warn{background:var(--amberbg);color:var(--amber)}.delta.flat{background:var(--panel3);color:var(--muted)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;border:0;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
button.kpi:hover{box-shadow:0 0 0 1px var(--line)}
.kpi .kl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.kpi .kl .kic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--text)}
.kpi .kval{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.kpi .num{font-size:32px;font-weight:550;letter-spacing:-.045em;line-height:1}
.kpi .num.pending{color:var(--subtle)}
.kpi .ks{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-height:20px}
.spark{display:block;flex:none}

/* Status slot (same component, 4 variants) */
.status{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);margin-bottom:16px}
.status .sic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accbg);color:var(--acc);flex:none}
.status.warn .sic{background:var(--amberbg);color:var(--amber)}.status.bad .sic{background:var(--redbg);color:var(--red)}
.status .sb{flex:1;min-width:0}.status b{font-weight:600}.status p{font-size:12.5px;color:var(--muted);margin-top:1px}
.status .sprog{width:180px;height:6px;border-radius:9px;background:var(--panel3);overflow:hidden}.status .sprog span{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}

/* Onboarding module (first-visit variant of the status slot) */
.onboard{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(0,1.45fr);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ob-scan{display:flex;gap:18px;align-items:center;padding:22px 24px}
.ob-scan h2{font-size:16px}
.scanlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px;font-size:12.5px}
.scanlist li{display:flex;align-items:center;gap:8px}.scanlist li>.ic{color:var(--muted)}
.scanlist b{font-weight:600;margin-left:auto;white-space:nowrap}
.scanlist li span:first-of-type{white-space:nowrap}.scanlist .okc{color:var(--green)}
.ob-how{padding:22px 24px;background:var(--panel2);display:flex;flex-direction:column;gap:16px}
.how{display:flex;align-items:flex-start;gap:4px}
.hstep{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.hcirc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--aquabg);color:var(--aqua);margin-bottom:6px}
.hstep.you .hcirc{background:var(--acc);color:var(--on-acc);box-shadow:0 0 0 5px var(--accbg)}
.hstep b{font-size:13.5px;font-weight:600}.hstep small{font-size:12px;color:var(--muted);line-height:1.3}
.who-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--aqua);margin-top:4px}.hstep.you .who-tag{color:var(--acc)}
.harrow{color:var(--subtle);margin-top:16px}
.split-bar{display:flex;height:8px;border-radius:9px;overflow:hidden;gap:3px}.split-bar .ag{background:var(--c2)}.split-bar .yo{background:var(--acc)}
.split-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}.split-lbl span{display:inline-flex;gap:5px;align-items:center}
.routine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.25fr);gap:16px;margin-bottom:16px}
.rcard{display:flex;gap:12px;background:var(--panel);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);align-items:flex-start}
.ricon2{width:38px;height:38px;border-radius:11px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;flex:none}
.rwhen{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.rcard b{display:block;font-size:13.5px;font-weight:600;margin-top:3px}.rcard small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.savecard{background:var(--panel);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.savecard h3{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.tbar{display:grid;grid-template-columns:100px 1fr 64px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:8px}
.tbar>div{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}.tbar i{display:block;height:100%;border-radius:9px}.tbar b{font-weight:600;text-align:right}

/* Insight card (dark ink) */
.insight{background:var(--ink);color:var(--ink-text);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;min-width:0}
.insight:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(232,212,138,.2),transparent 70%);pointer-events:none}
.insight .eyebrow{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--butter)}
.insight h2{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.25;color:#fff}
[data-theme=dark] .insight h2{color:var(--ink-text)}
.insight p{color:var(--ink-muted);font-size:13px}
.istats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.istats div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.istats span{display:block;font-size:12px;color:var(--ink-muted)}.istats b{display:block;font-size:19px;font-weight:600;letter-spacing:-.03em;color:#fff;margin-top:2px}
[data-theme=dark] .istats b{color:var(--ink-text)}
.istats em{font-style:normal;font-size:11.5px;color:var(--butter)}
.insight .btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal);align-self:flex-start;margin-top:auto}
.insight .btn.primary:hover{filter:brightness(1.06)}
.insight .achips{display:flex;flex-wrap:wrap;gap:6px}
.insight .chip{background:rgba(255,255,255,.08);color:var(--ink-text)}.insight .chip .ic{color:var(--ink-muted)}.insight .chip.crit{background:rgba(231,181,74,.18);color:#F3CF85}

/* Signal flow (same component all states) */
.flow{padding:4px 20px 20px}
.flow-total{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.flow-total b{font-size:34px;font-weight:550;letter-spacing:-.045em;line-height:1}
.flow-total span{color:var(--muted);font-size:13px}
.flowbar{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:3px;background:var(--panel2)}
.flowbar span{min-width:8px;height:100%;transition:flex .6s}
.flowbar.scan span{background:repeating-linear-gradient(-45deg,var(--accbg) 0 6px,transparent 6px 12px)}
.flowlegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.fl{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:0;text-align:left}
button.fl:hover{background:var(--panel3)}
.fl .fll{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted)}
.fl .fll i{width:9px;height:9px;border-radius:3px;flex:none}
.fl b{font-size:22px;font-weight:550;letter-spacing:-.04em}
.fl small{font-size:12px;color:var(--muted)}
.fl.people{background:var(--redbg)}.fl.people b{color:var(--red)}
.fl.people.zero{background:var(--panel2)}.fl.people.zero b{color:var(--text)}

/* Queue */
.queue{list-style:none;margin:0;padding:0 10px 10px}
.qitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:14px 12px;border-radius:14px;align-items:center}
.qitem+.qitem{box-shadow:0 -1px 0 var(--line2)}
.qitem:hover{background:var(--panel2)}
.qitem.fresh{background:var(--pb)}
.qic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);color:var(--text);position:relative}
.qitem.critical .qic{background:var(--redbg);color:var(--red)}.qitem.high .qic{background:var(--orangebg);color:var(--orange)}.qitem.medium .qic{background:var(--amberbg);color:var(--amber)}
.qic .grp{position:absolute;right:-6px;bottom:-6px;font-size:10.5px;font-weight:700;background:var(--text);color:var(--panel);border-radius:99px;padding:1px 6px;box-shadow:0 0 0 2px var(--panel)}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;font-size:12.5px;color:var(--muted)}
.qtitle{font-size:14px;font-weight:600;line-height:1.35;color:var(--text);border:0;background:none;padding:0;text-align:left;letter-spacing:-.01em}
.qtitle:hover{color:var(--teal);text-decoration:underline}
.qwhy{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin-top:4px}.qwhy .ic{color:var(--aqua);margin-top:2px}
.qfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.qfoot span{display:inline-flex;align-items:center;gap:5px}
.qact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.qact .next{font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.moved{color:var(--red);font-weight:600;display:inline-flex;gap:3px;align-items:center}
.qmore{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:var(--muted)}

/* Empty state (same pattern everywhere) */
.empty{padding:28px 24px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.empty .eicon{width:52px;height:52px;border-radius:16px;background:var(--panel2);display:grid;place-items:center;color:var(--acc);margin-bottom:4px}
.empty h3{font-size:14.5px}.empty p{color:var(--muted);font-size:12.5px;max-width:44ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;align-items:center}

/* Agents rail */
.astates{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 20px 10px;font-size:12px;color:var(--muted)}
.astate{display:inline-flex;align-items:center;gap:6px}.astate i{width:8px;height:8px;border-radius:50%;background:var(--subtle)}
.astate.await i{background:var(--amber)}.astate.exec i{background:var(--acc)}.astate.inv i{background:var(--aqua2)}.astate.blocked i{background:var(--red)}.astate.mon i{background:var(--green)}
.agents{list-style:none;margin:0;padding:0 10px 6px}
.agent{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px}
.agent:hover{background:var(--panel2)}
.agent .aicon{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);flex:none}
.agent.await .aicon{background:var(--amberbg);color:var(--amber)}.agent.exec .aicon{background:var(--accbg);color:var(--acc)}.agent.inv .aicon{background:var(--aquabg);color:var(--aqua)}.agent.blocked .aicon{background:var(--redbg);color:var(--red)}
.agent .abody{flex:1;min-width:0}
.arow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.agent b{font-size:13px;font-weight:600}
.apct{font-size:12px;font-weight:600;color:var(--aqua)}
.astat{font-size:12px;color:var(--muted)}
.agent.await .astat{color:var(--amber);font-weight:600}.agent.blocked .astat{color:var(--red);font-weight:600}.agent.exec .astat{color:var(--acc);font-weight:600}
.agent .adesc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:4px;border-radius:9px;background:var(--panel3);overflow:hidden;margin-top:6px}.mini span{display:block;height:100%;background:var(--c1);border-radius:9px;transition:width .6s linear}
.rail-foot{display:flex;align-items:center;gap:7px;padding:12px 20px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line2)}
.paused-note{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:var(--amberbg);color:var(--amber);font-size:12.5px;display:flex;gap:8px}
.livedot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* Charts */
.chartwrap{padding:0 20px 8px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{font:11px var(--sans);fill:var(--muted)}.chart .axis.strong{fill:var(--text);font-weight:600}
.chart .gridl{stroke:var(--line2);stroke-width:1}
.ring .ring-big{font:600 24px var(--sans);fill:var(--text);letter-spacing:-.04em}.ring .ring-small{font:11.5px var(--sans);fill:var(--muted)}
.legend2{list-style:none;margin:0;padding:6px 20px 18px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend2.row{flex-direction:row;flex-wrap:wrap;gap:6px 16px;padding:10px 0 0}.legend2.row.pad{padding:8px 20px 18px}
.legend2 li{display:flex;align-items:center;gap:8px}.legend2 i{width:9px;height:9px;border-radius:3px;flex:none}
.legend2 b{margin-left:auto;font-weight:600}.legend2.row b{margin-left:2px}
.donutwrap{display:flex;align-items:center;gap:16px;padding:4px 20px 18px}.donutwrap .legend2{flex:1;padding:0}
.chart-empty{margin:0 20px 20px;height:150px;border-radius:12px;background:repeating-linear-gradient(-45deg,var(--panel2) 0 8px,transparent 8px 16px);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px}
.pipe{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;background:var(--panel2)}.pipe span{min-width:8px}
.alerts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.alert{display:inline-flex;gap:6px;align-items:center;border:0;border-radius:99px;padding:6px 12px;background:var(--redbg);color:var(--red);font-size:12.5px}.alert b{font-weight:650}
.alert.ok{background:var(--greenbg);color:var(--green)}

/* Lists inside cards */
.rows{list-style:none;margin:0;padding:0 10px 10px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 10px;border-radius:12px}
.rows li+li{box-shadow:0 -1px 0 var(--line2)}
.rows li:hover{background:var(--panel2)}
.rows .rmain{display:flex;gap:10px;align-items:center;min-width:0}
.rows .rmain>div{min-width:0}
.rows .rnum{font-size:11.5px;color:var(--subtle);font-weight:600;width:22px}
.rows .rt{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .rs{font-size:12px;color:var(--muted);display:block}
.rows .owner{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.hbar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;width:110px}.hbar span{display:block;height:100%;background:var(--acc);border-radius:9px}

/* Toolbar + table (list screens) */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px 12px}
.toolbar .grow{flex:1}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px dashed var(--line);background:transparent;font-size:12.5px;color:var(--muted)}
.fbtn:hover{border-style:solid;color:var(--text)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.toggle input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--panel3);position:relative;margin:0;cursor:pointer;transition:background .15s}
.toggle input:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle input:checked{background:var(--acc)}.toggle input:checked:after{left:16px}
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.table th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.table td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:var(--panel2)}
.table .cb{width:36px}.table input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);margin:0}
.tablewrap{overflow-x:auto;padding:0 8px 8px}
.cellmain{font-weight:600}.cellsub{font-size:12px;color:var(--muted)}
.grouprow td{background:var(--panel2)}.grouprow .gname{display:flex;gap:10px;align-items:center}
.grouprow .gcount{font-size:11.5px;font-weight:700;background:var(--text);color:var(--panel);border-radius:99px;padding:1px 8px}
.bulkbar{position:sticky;bottom:76px;z-index:40;margin:12px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:99px;background:var(--ink);color:var(--ink-text);box-shadow:var(--pop);font-size:13px}
.bulkbar .btn{background:rgba(255,255,255,.08);border-color:transparent;color:var(--ink-text)}
.bulkbar .btn.primary{background:var(--teal);color:var(--on-teal)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 16px;font-size:12.5px;color:var(--muted)}

/* Assets */
.agroup{margin-bottom:6px}
.agh{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;font-size:12.5px;color:var(--muted)}
.agh b{color:var(--text);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.arowx{display:grid;grid-template-columns:minmax(0,1fr) 120px 100px 100px 176px;gap:12px;align-items:center;padding:10px 20px}
.arowx+.arowx{border-top:1px solid var(--line2)}
.arowx .an{display:flex;gap:10px;align-items:center;min-width:0}
.arowx .an .aic{width:32px;height:32px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--acc);flex:none}
.arowx .an b{font-size:13px;font-weight:600;display:block}.arowx .an small{font-size:12px;color:var(--muted)}
.crit-star{color:var(--amber)}
.swatches{display:flex;gap:6px}.swatch{width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.brandlogo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}.brandlogo span{width:32px;height:32px;border-radius:9px;background:#1F2328;color:#fff;display:grid;place-items:center;font-size:14px}

/* Intelligence */
.graph{width:100%;height:auto;display:block}
.graph .gn{font:600 12px var(--sans);fill:var(--text)}.graph .gs{font:11px var(--sans);fill:var(--muted)}

/* Reports */
.brief-preview{background:var(--panel2);border-radius:14px;padding:18px;margin:0 20px 20px}
.brief-preview h3{font-size:15px;margin-bottom:10px}
.brief-preview ul{margin:0;padding-left:18px;font-size:13px;display:grid;gap:6px}

/* Settings */
.settings{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.stabs{display:flex;flex-direction:column;gap:2px;background:var(--panel);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
.stabs button{display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:9px 12px;border-radius:10px;font-size:13px;color:var(--muted);text-align:left}
.stabs button[aria-selected=true]{background:var(--accbg);color:var(--acc);font-weight:600}
.stabs button:hover{color:var(--text)}
.rulecard{display:flex;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line2)}
.rulecard .rb{flex:1;min-width:0}.rulecard b{font-size:13.5px;font-weight:600}.rulecard small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.lvl{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.lvl.ask{background:var(--amberbg);color:var(--amber)}.lvl.auto{background:var(--accbg);color:var(--acc)}.lvl.never{background:var(--panel3);color:var(--muted)}
.intg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 20px 20px}
.icard{border-radius:14px;background:var(--panel2);padding:14px;display:flex;flex-direction:column;gap:8px}
.icard .ih{display:flex;gap:10px;align-items:center}.icard .ilogo{width:34px;height:34px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-weight:700;color:var(--acc)}
.icard b{font-size:13.5px}.icard small{font-size:12px;color:var(--muted)}

/* Kv list */
.kv{list-style:none;margin:0;padding:0 20px 16px}
.kv li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:13px}
.kv li+li{border-top:1px solid var(--line2)}.kv li span:first-child{color:var(--muted)}.kv li b{font-weight:600;text-align:right}

/* ===== Investigation detail ===== */
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:8px 0 14px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--teal);font-size:13px}
.samplebar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:14px;background:var(--amberbg);color:var(--amber);font-size:13px;margin-bottom:14px}.samplebar b{font-weight:600}
.ihead{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:16px}
.ihead h1{font-size:24px}
.ihead .domain{font-size:13.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ihead .domain .mono{color:var(--text)}
.ihead .top-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.facts{display:flex;flex-wrap:wrap;gap:10px 32px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600;margin-top:3px}
.fact .avatar{display:inline-grid;line-height:1}
.iv{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.iv>*{min-width:0}
.iv .rail{position:sticky;top:80px;display:flex;flex-direction:column;gap:16px}
@media (max-height:860px){.iv .rail{position:static}}
.only-narrow{display:none}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line2)}
.tabs button{border:0;background:none;padding:10px 12px;font-size:13.5px;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center;border-radius:0}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--acc)}
.tabs .n{font-size:11px;background:var(--panel3);border-radius:99px;padding:0 7px}
.tabpanel{padding:20px 22px 22px}
.brief h2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brief .lead{font-size:14px;line-height:1.6;max-width:72ch}
.brief h3{margin:22px 0 10px;display:flex;align-items:center;gap:7px}
.glance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.gcell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:14px;padding:14px;text-align:left;background:var(--panel2);position:relative}
.gcell:hover{background:var(--panel3)}
.gcell .gic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel);margin-bottom:8px}
.gcell b{font-size:19px;font-weight:600;letter-spacing:-.035em}.gcell span{font-size:12px;color:var(--muted)}
.gcell em{position:absolute;top:12px;right:12px;font:600 11px var(--sans);font-style:normal;color:var(--acc)}
.gcell.bad .gic,.gcell.bad b{color:var(--red)}.gcell.warn .gic{color:var(--amber)}.gcell.ok .gic{color:var(--green)}
.kw{display:grid;grid-template-columns:1fr 1fr;gap:20px}.kw h3{margin-top:18px}
.claims{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.claims li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5}
.claims li>.ic{margin-top:2px}.claims .yes{color:var(--green)}.claims .unk{color:var(--amber)}.claims .no{color:var(--red)}
.cite{display:inline-flex;align-items:center;font:600 11px var(--sans);border:0;background:var(--tealbg);color:var(--teal);border-radius:6px;padding:1px 6px;margin-left:5px;vertical-align:1px;cursor:pointer}
.recobox{margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--aquabg)}
.recobox b{display:flex;gap:7px;align-items:center;color:var(--aqua);font-size:13px}.recobox p{margin-top:5px;font-size:13px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot{border-radius:14px;background:var(--panel2);padding:12px;min-width:0}
.shot .cap{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:8px;align-items:center}
.browser{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #e5dfd3;color:#1f2328}
.browser .bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#f7f4ee;font:11.5px var(--sans);color:#67635b;border-bottom:1px solid #e5dfd3;white-space:nowrap;overflow:hidden}
.browser .bar i{width:7px;height:7px;border-radius:50%;background:#d9d2c4;flex:none}
.browser .pg{padding:16px 18px 36px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.browser .lg{display:flex;align-items:center;gap:6px;font-weight:750;font-size:13px}.browser .lg span{width:18px;height:18px;border-radius:5px;background:#1f2328;color:#fff;display:grid;place-items:center;font-size:10px}
.browser .fld{width:100%;max-width:170px;height:20px;border-radius:5px;border:1px solid #d9d2c4}.browser .go{width:100%;max-width:170px;height:22px;border-radius:5px;background:#0969da}
.browser .note{font-size:9.5px;color:#67635b}
.annot{position:absolute;right:8px;bottom:8px;font:600 10.5px var(--sans);background:#b42318;color:#fff;padding:3px 8px;border-radius:99px}
.confviz{display:flex;gap:22px;align-items:center}.confviz .cbars{flex:1}
.cbars{display:grid;gap:10px}
.cbar{display:grid;grid-template-columns:180px minmax(0,1fr) 80px;gap:12px;align-items:center;font-size:13px}
.cbar .track{height:6px;border-radius:9px;background:var(--panel3);overflow:hidden}.cbar .track span{display:block;height:100%;border-radius:9px;background:var(--acc)}
.cbar em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.evlist{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px 0;scroll-margin-top:90px;border-radius:12px}
.ev+.ev{border-top:1px solid var(--line2)}
.ev .eid{font:600 12px var(--sans);color:var(--acc);background:var(--accbg);border-radius:9px;height:28px;display:grid;place-items:center}
.ev b{font-size:13.5px;font-weight:600}
.ev dl{margin:6px 0 0}.ev dl div{display:flex;gap:10px;padding:2px 0;font-size:13px}
.ev dt{color:var(--muted);min-width:160px;flex:none}.ev dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ev .prov{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--subtle);margin-top:8px}.ev .prov span{display:inline-flex;gap:5px;align-items:center}
.ev.flash{animation:flash 1.6s ease-out}@keyframes flash{0%{background:var(--accbg)}100%{background:transparent}}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl:before{content:"";position:absolute;left:14px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.tl li{display:grid;grid-template-columns:30px 52px minmax(0,1fr);gap:10px;padding:7px 0;position:relative;align-items:start}
.tl .who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 3px var(--panel);z-index:1}
.who.ai{background:var(--aquabg);color:var(--aqua)}.who.human{background:var(--accbg);color:var(--acc)}.who.sys{background:var(--panel3);color:var(--muted)}.who.ext{background:var(--greenbg);color:var(--green)}
.tl time{font-size:12.5px;color:var(--muted);padding-top:6px}
.tl .what{font-size:13px;padding-top:5px}.tl .what small{display:block;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:14px}.legend span{display:inline-flex;gap:6px;align-items:center}
.rel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

function chime(){
 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ctx=new A(),t=ctx.currentTime,master=ctx.createGain();master.gain.value=.07;master.connect(ctx.destination);
  [[659.25,0],[987.77,.12]].forEach(([f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(1,t+d+.015);g.gain.exponentialRampToValueAtTime(.001,t+d+.55);o.connect(g);g.connect(master);o.start(t+d);o.stop(t+d+.6)});
  setTimeout(()=>ctx.close(),1200)}catch(_){}
}

  <div class="confetti" id="confetti" aria-hidden="true"></div></section>`;
 const D=reduceMotion?120:850;
 const set=(i,c)=>{const li=$("#ls"+i);if(!li)return;li.className=c;li.querySelector(".lsr").textContent=c==="done"?"Done":c==="now"?"In progress":"Waiting"};

   setTimeout(()=>{document.body.classList.remove("launching");setStage("first",true);go("overview");toast("Welcome to Monitir. Your first scan has started.");setTimeout(()=>{S.tourDone=false;startTour()},700)},reduceMotion?400:1500);
  },reduceMotion?100:300);
 };

/* ---------- Theme ---------- */
function setTheme(dark,save=true){document.documentElement.dataset.theme=dark?"dark":"light";$("#themeLight").setAttribute("aria-pressed",!dark);$("#themeDark").setAttribute("aria-pressed",dark);if(save)try{localStorage.setItem("monitir-theme",dark?"dark":"light")}catch(_){}}
$("#themeLight").onclick=()=>setTheme(false);$("#themeDark").onclick=()=>setTheme(true);
let saved=null;try{saved=localStorage.getItem("monitir-theme")}catch(_){}
setTheme(saved?saved==="dark":matchMedia("(prefers-color-scheme: dark)").matches,false);
